spring:
  application:
    name: Mercedez_System
  datasource:
    url: jdbc:postgresql://localhost:5432/db_barberia
    username: ${DB_USER:barberia}
    password: ${DB_PASSWORD:barberia123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:miClaveSecretaSuperSeguraParaJWT2026BarberiaMercedes}
  expiration: 86400000

logging:
  level:
    com.mercedes.barberia: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG